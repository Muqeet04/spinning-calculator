name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Universal Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MM-spinning-calculator-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MM spinning calculator v1.0.0 Release"
          body: |
            ## MM spinning calculator v1.0.0
            **Owner & Lead Engineer**: Muqeet Mahmood (muqeetmahmood8@gmail.com)
            
            ### Included in this release:
            - **Universal Android APK (`app-release.apk`)**: Full offline spinning mill calculator for any Android device.
            - **All 10 Calculation Modules**: Complete from Blow Room to Winding.
            - **User Guide (`Spin_Logic_User_Guide.pdf`)**: Functional manual for website and app.
            
            ### Installation on Android:
            1. Download `app-release.apk` below directly to your device.
            2. Tap the file in your downloads folder to install (tap "Allow from this source" if prompted).
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            Spin_Logic_User_Guide.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
